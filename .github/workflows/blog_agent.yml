name: Auto Blog Agent

on:
  schedule:
    - cron: '0 9 * * 1' # Runs automatically every Monday at 9:00 AM UTC
  workflow_dispatch:    # Lets you run it manually anytime

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --break-system-packages groq

      - name: Run Blog Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python agent.py

      - name: Commit and push new post
        run: |
          git config --global user.name "AI Blog Agent"
          git config --global user.email "agent@users.noreply.github.com"
          git add posts/ README.md
          git commit -m "Publish new blog post" || exit 0
          git push
